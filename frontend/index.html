    <!-- v3 redesign typefaces: Spectral (display statements and first-class
         figures; a journal serif with a true light weight, so hierarchy comes from
         scale and weight rather than boldness), Schibsted Grotesk (interface
         grotesque drawn for screens), DM Mono (measured numerals for clinical
         readouts). Separate from the v1 pair above; used only under /v3. -->
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;0,500;1,300&family=Schibsted+Grotesk:wght@400..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-surface font-sans text-ink-900 antialiased">
    <!--
      THESIS: A clinical monitoring product should read like the instrument panel it
      actually is, not another gradient AI-SaaS dashboard; precision and calm over decoration.
      OWN-WORLD: Warm off-white "paper" surfaces, graphite ink, one steady instrument blue,
      hairline rules over shadow, tabular-numeral readouts on every clinical value, status
      color (blue/amber/red) reserved strictly for real clinical state, never decoration.
      STORY: Patients see their own status board (calm, plain-language); clinicians scan a
      multi-patient board fast; nothing is buried under visual flourish.
      FIRST VIEWPORT: Full-bleed status board, identity strip, live risk/readout panels,
      quiet instrument cards below, primary action always legible without scrolling.
      FORM: "Clinical Control Room", direction 6 of 7, seed key 768e135d, raised with hairline
      waveform precision (Ikeda), explicit state-labels-not-color-alone (stagecraft), disciplined
      schematic geometry for body/organ diagrams (transit cartography), append-only audit trail
      (jet-age coupon wallet).
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
      the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
